:white;background:var(--dark);border-color:var(--dark)}.search{position:relative;min-width:220px;flex:0 1 270px}.search input{width:100%;margin:0;padding-left:30px}.search span{position:absolute;top:7px;left:11px;color:var(--muted);font-size:18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:19px;box-shadow:var(--shadow)}.card{display:flex;flex-direction:column;min-height:235px;min-width:0}.category{padding:4px 8px;border-radius:6px;background:var(--lime);font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:850}.tone-1{background:var(--peach)}.tone-2{background:var(--blue)}.tone-3{background:#edebcb}.card h3{font-size:20px;line-height:1.16;letter-spacing:-.025em;margin:15px 0 5px;overflow-wrap:anywhere}.card p,.muted,.note{color:var(--muted)}.card p{margin:0 0 17px;overflow-wrap:anywhere}.card-foot{margin-top:auto;flex-wrap:wrap}.person{display:flex;align-items:center;gap:8px;min-width:0}.person strong,.person small{display:block;overflow-wrap:anywhere}.person small{color:var(--muted)}.person .avatar{width:34px;height:34px;font-size:12px}.count{font-size:13px;color:var(--muted);margin:0 0 10px}.footer{margin:36px auto 0;padding:17px 0 26px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px}.footer span:first-child{font-weight:800;letter-spacing:.08em}.page-head{margin:36px 0 22px}.page-head p{margin:8px 0 0}.request-list{display:grid;gap:10px}.request-row{display:flex;justify-content:space-between;align-items:center;gap:15px}.request-row .person p{margin:4px 0;overflow-wrap:anywhere}.subhead{margin:24px 0 8px}.status{font-size:12px;font-weight:750;color:var(--muted)}.chat-layout{display:grid;grid-template-columns:minmax(200px,1fr) minmax(0,2.6fr);gap:14px}.chat-menu{align-self:start;padding:8px}.thread{display:block;text-align:left;width:100%;padding:10px;border:0;border-radius:9px;background:transparent;color:var(--ink);overflow-wrap:anywhere}.thread.active{background:#ecf3d7}.thread small{display:block;color:var(--muted)}.chat-main{min-height:340px;display:flex;flex-direction:column;padding:14px}.chat-title{margin:0;padding:4px 2px 12px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.bubbles{min-height:205px;max-height:400px;overflow:auto;display:flex;flex-direction:column;align-items:start;gap:8px;padding:12px 0}.bubble{background:#edf2ee;border-radius:12px;padding:7px 11px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.mine{align-self:end;background:var(--lime)}.chat-composer{display:flex;gap:8px;margin-top:auto}.chat-composer input{margin:0}.empty{border:1px dashed #bcbeb1;border-radius:14px;padding:22px;color:var(--muted);grid-column:1/-1}.empty p{margin:0 0 10px}.inline-msg{margin:12px 0;color:var(--muted)}dialog{width:min(475px,calc(100% - 24px));border:1px solid var(--line);background:var(--card);color:var(--ink);padding:22px;border-radius:17px;box-shadow:0 18px 70px #152a2170}dialog::backdrop{background:#152a2170}dialog h2{margin:0;font-size:25px;letter-spacing:-.03em}form label{display:block;font-weight:750;margin-top:12px}input,textarea,select{display:block;width:100%;border:1px solid #bfc7bc;background:white;color:var(--ink);border-radius:8px;padding:8px;margin:4px 0}textarea{resize:vertical;min-height:88px}form .button{margin-top:10px}.chat-composer .button{margin:0}.error{color:#9a2d2a;min-height:1.3rem;font-size:13px}#toast{position:fixed;right:16px;bottom:16px;z-index:3;background:var(--dark);color:white;border-radius:10px;padding:10px 14px;max-width:min(370px,92vw);box-shadow:var(--shadow)}#toast:empty{display:none}.icon{font-size:13px;line-height:1}.tiny{font-size:12px}
@media(max-width:880px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-text{padding-left:30px}.art{min-height:270px}.wrap{width:calc(100% - 36px)}}
@media(max-width:585px){.top{display:grid;grid-template-columns:1fr auto;gap:0;min-height:0;padding-top:10px}.top nav{grid-column:1/-1;grid-row:2;justify-content:space-between;padding:6px 0;gap:0}.top nav button{padding:6px 9px;font-size:13px}.top-actions{grid-row:1;grid-column:2}.hero{grid-template-columns:1fr;min-height:0;margin:18px 0 29px}.hero-text{padding:25px 20px 5px}.hero h1{font-size:clamp(47px,12vw,65px)}.hero p:not(.eyebrow){margin:12px 0 15px;font-size:14px}.art{max-height:162px;min-height:0}.grid{grid-template-columns:1fr}.search{flex:1 1 100%}.wrap{width:calc(100% - 28px)}.card{min-height:0}.request-row{align-items:flex-start;flex-wrap:wrap}.request-actions{flex-wrap:wrap}.chat-layout{grid-template-columns:1fr}.chat-menu{display:flex;overflow:auto}.thread{min-width:110px}.section-head .button{font-size:12px}.footer{flex-wrap:wrap}}

<header class="bar"><div class="wrap top">
<button class="brand" data-view="discover" aria-label="Manipal Links home"><span class="mark">↗</span> manipal<span class="brand-accent">links.</span></button>
<nav aria-label="Main"><button data-view="discover">Discover</button><button data-view="requests">Requests <span id="badge" hidden></span></button><button data-view="messages">Messages</button></nav>

<script>'use strict';
const el=(q)=>document.querySelector(q), h=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const categories=['Hackathon','Gym','Study','Other'];
const people=[{id:'top-g',name:'Top G (demo)',detail:'Gym training'},{id:'demo-you',name:'Nishwin (demo)',detail:'Sample profile'},{id:'a',name:'Aarav (demo)',detail:'Computer Engineering'},{id:'b',name:'Maya (demo)',detail:'Mechanical Engineering'},{id:'c',name:'Sana (demo)',detail:'Data Science'},{id:'d',name:'Kabir (demo)',detail:'Electrical Engineering'}];
const gymPost={id:'top-g-gym',owner:'top-g',category:'Gym',title:'Gym training with Top G',body:'Looking for a training partner for three evening sessions a week. All levels welcome. Let’s get consistent.'};
const initial={active:'demo-you',posts:[gymPost,
{id:'1',owner:'a',category:'Hackathon',title:'Looking for a hackathon teammate',body:'I’ll handle backend. Looking for someone who enjoys design or frontend and can meet this weekend.'},
{id:'2',owner:'b',category:'Gym',title:'Evening gym buddy',body:'Beginner-friendly sessions, three evenings a week. Looking for someone who wants to stay consistent.'},
{id:'3',owner:'c',category:'Study',title:'Data structures prep group',body:'Let’s work through trees and graphs together before intern applications. Library or online works.'},
{id:'4',owner:'d',category:'Other',title:'Weekend photowalk',body:'A relaxed Saturday walk around campus to take photos and swap editing tips.'},
{id:'5',owner:'demo-you',category:'Study',title:'Looking for a Java practice partner',body:'Short practice sessions, a few problems each week.'}], requests:[{id:'demo-incoming',post:'5',from:'c',to:'demo-you',status:'pending',intro:'Hey! I’m revising Java too. Want to pair up?'}],messages:[]};
const key='ml-demo-v1';let demo=false, data, view='discover', category='All', query='', activeThread='', timer, refreshing=false, posting=false;
function uid(){return globalThis.crypto?.randomUUID?.()??Date.now().toString(36)+Math.random().toString(36).slice(2);}
const freshDemo=()=>JSON.parse(JSON.stringify(initial));
function getDemo(){try{const saved=JSON.parse(localStorage.getItem(key));if(!saved)return freshDemo();if(!saved.posts.some(p=>p.id===gymPost.id))saved.posts.unshift({...gymPost});return saved;}catch{return freshDemo()}}
let demoStore=getDemo();function saveDemo(){try{localStorage.setItem(key,JSON.stringify(demoStore))}catch{}}
function snapshot(){const me=people.find(p=>p.id===demoStore.active);return {me,posts:demoStore.posts.map(p=>({...p,author:people.find(x=>x.id===p.owner)})),requests:demoStore.requests.filter(r=>[r.from,r.to].includes(me.id)).map(r=>({...r,other:people.find(p=>p.id===(r.from===me.id?r.to:r.from)),title:demoStore.posts.find(p=>p.id===r.post)?.title??'Campus link'}))}}
async function http(path,method='GET',payload){const res=await fetch('/api/'+path,{method,headers:payload?{'Content-Type':'application/json'}:{},body:payload?JSON.stringify(payload):undefined});const d=await res.json();if(!res.ok)throw Error(d.error||'Something went wrong.');return d;}
async function call(path,payload){if(!demo)return http(path,payload?'POST':'GET',payload);const [kind,id,action]=path.split('/');const me=demoStore.active;if(kind==='state')return snapshot();
 if(kind==='posts')demoStore.posts.unshift({id:uid(),owner:me,...payload});
 else if(kind==='requests'&&!id){const p=demoStore.posts.find(x=>x.id===payload.post);if(!p||p.owner===me)throw Error('Choose another student’s post.');if(demoStore.requests.some(r=>r.from===me&&r.post===p.id&&r.status!=='declined'))throw Error('Request already sent.');demoStore.requests.push({id:uid(),post:p.id,from:me,to:p.owner,status:'pending',intro:payload.intro});}
 else if(kind==='requests'){const r=demoStore.requests.find(x=>x.id===id);if(!r||r.to!==me||r.status!=='pending')throw Error('This request is no longer available.');r.status=action==='accept'?'accepted':'declined';}
 else if(kind==='messages'){const r=demoStore.requests.find(r=>r.id===id);if(!r||r.status!=='accepted'||![r.from,r.to].includes(me))throw Error('Chat is available only after acceptance.');if(!payload)return {messages:demoStore.messages.filter(x=>x.request===id)};demoStore.messages.push({id:uid(),request:id,author:me,text:payload.text});}
 else throw Error('This action is not available in demo mode.');saveDemo();return {};}
const initials=(s)=>s.replace(/\s*\(demo\)/,'').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
const av=(p,i=0)=>'<span class="avatar tone-'+i%4+'" aria-hidden="true">'+h(initials(p.name))+'</span>';
const person=(p,i=0)=>'<div class="person">'+av(p,i)+'<div><strong>'+h(p.name)+'</strong><small>'+h(p.detail||'Student')+'</small></div></div>';
const art='<svg class="art" viewBox="0 0 500 340" aria-hidden="true"><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#e5f49a" opacity=".21"/></pattern></defs><rect width="500" height="340" fill="url(#dots)"/><g fill="none" stroke="#a6c9a8" opacity=".55"><circle cx="260" cy="171" r="126"/><circle cx="260" cy="171" r="97"/><path stroke-dasharray="5 7" d="M93 220 205 93 380 111 362 245 210 246 93 220M205 93l57 80 100 72m18-134-118 62-52 73"/></g><g transform="translate(262 173)"><circle r="47" fill="#e5f49a"/><path d="m-15 10 25-25m-18 0h18V3" stroke="#163b34" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g fill="#163b34" font-family="monospace" font-weight="bold" font-size="13"><g transform="translate(136 65) rotate(-8)"><rect width="117" height="43" rx="9" fill="#ffd4b6"/><text x="13" y="27">&lt;/&gt; HACK</text></g><g transform="translate(330 96) rotate(8)"><rect width="99" height="39" rx="9" fill="#dce5ff"/><text x="13" y="25">+ GYM</text></g><g transform="translate(51 207) rotate(-5)"><rect width="104" height="39" rx="9" fill="#dce5ff"/><text x="13" y="25">→ STUDY</text></g><g transform="translate(327 231) rotate(-7)"><rect width="111" height="38" rx="9" fill="#ffd4b6"/><text x="13" y="25">••• CHAT</text></g></g><g fill="#e5f49a"><circle cx="107" cy="112" r="3"/><circle cx="424" cy="173" r="3"/><circle cx="210" cy="246" r="5"/><path d="M292 42v18m-9-9h18m137 154v16m-8-8h16" stroke="#e5f49a" stroke-width="1.5"/></g></svg>';
const empty=(s,extras='')=>'<div class="empty"><p>'+h(s)+'</p>'+extras+'</div>';
const page=(tag,title,desc)=>'<div class="page-head"><p class="kicker">'+h(tag)+'</p><h1 class="page-title">'+h(title)+'</h1><p class="muted">'+h(desc)+'</p></div>';
function setNav(){document.querySelectorAll('nav [data-view]').forEach(b=>b.dataset.view===view?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));const n=data.requests.filter(r=>r.to===data.me?.id&&r.status==='pending').length;el('#badge').hidden=!n;el('#badge').textContent=n;el('#mode').textContent=demo?'Interactive demo':'Private pilot';el('#account').textContent=data.me?initials(data.me.name):'↗';el('#account').title=demo?'Switch demo profile':data.me?'Account':'Sign in';}
function discover(){return '<section class="hero"><div class="hero-text"><p class="eyebrow">Unofficial campus community / Manipal</p><h1>Find your<br><em>people.</em></h1><p>Need a hackathon teammate, a gym buddy, or someone to study with? Find a post, send a request, and chat when they accept.</p><button class="button lime" data-action="new">＋ Post what you need</button></div>'+art+'</section><section aria-labelledby="browse-title"><div class="section-head"><div><p class="kicker">01 / Explore campus</p><h2 id="browse-title">Find a campus link.</h2></div></div><div class="toolbar"><div class="filters" aria-label="Filter by purpose">'+['All',...categories].map((c,i)=>'<button class="chip" data-category="'+h(c)+'" aria-pressed="'+(c===category)+'">'+h(['All links','〈/〉 Hackathon','＋ Gym','☰ Study','✧ Other'][i])+'</button>').join('')+'</div><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" aria-label="Search posts" placeholder="Search interests or skills" value="'+h(query)+'"></label></div><p id="count" class="count" aria-live="polite"></p><div class="grid" id="cards"></div></section>';}
function cards(){const term=query.trim().toLowerCase();const rows=data.posts.filter(p=>(category==='All'||p.category===category)&&[p.title,p.body,p.category,p.author.name,p.author.detail].join(' ').toLowerCase().includes(term));el('#count').textContent=rows.length+' '+(rows.length===1?'post':'posts')+(demo?' · fictional profiles':'');el('#cards').innerHTML=rows.map((p,i)=>{const r=data.requests.find(q=>q.post===p.id&&q.from===data.me?.id&&q.status!=='declined');const button=p.owner===data.me?.id?'<span class="status">Your post</span>':r?.status==='accepted'?'<button class="button" data-thread="'+h(r.id)+'">Open chat ↗</button>':r?'<button class="button ghost" disabled>Request sent</button>':'<button class="button" data-post="'+h(p.id)+'">Connect ↗</button>';return '<article class="card"><div class="listing-top"><span class="category tone-'+categories.indexOf(p.category)+'">'+h(p.category)+'</span></div><h3>'+h(p.title)+'</h3><p>'+h(p.body)+'</p><div class="card-foot">'+person(p.author,i)+button+'</div></article>';}).join('')||empty('No posts match those filters.','<button class="button ghost" data-action="reset-filter">Clear filters</button>');}
function requests(){if(!data.me)return empty('Sign in to manage pairing requests.','<button class="button" data-action="account">Sign in</button>');
 const renderRows=(rows,inbound)=>rows.map((r,i)=>'<article class="panel request-row"><div>'+person(r.other,i)+'<p class="tiny"><strong>'+h(r.title)+'</strong>'+ (r.intro?' · '+h(r.intro):'')+'</p></div><div class="request-actions">'+(r.status==='accepted'?'<button class="button" data-thread="'+h(r.id)+'">Open chat ↗</button>':r.status==='pending'&&inbound?'<button class="button" data-respond="accept" data-id="'+h(r.id)+'">Accept</button><button class="button ghost" data-respond="decline" data-id="'+h(r.id)+'">Decline</button>':'<span class="status">'+(r.status==='pending'?'Pending':'Declined')+'</span>')+'</div></article>').join('');
 const incoming=data.requests.filter(r=>r.to===data.me.id),outgoing=data.requests.filter(r=>r.from===data.me.id);
 return '<h2 class="subhead">Received</h2><div class="request-list">'+(renderRows(incoming,true)||empty('No one has requested to connect with you yet.'))+'</div><h2 class="subhead">Sent</h2><div class="request-list">'+(renderRows(outgoing,false)||empty('Find a post to send your first request.'))+'</div>';
}
function chat(){const list=data.requests.filter(r=>r.status==='accepted');if(!list.length)return empty('No chats yet. When a connection is accepted, its chat will appear here.','<button class="button" data-view="requests">View requests</button>');if(!list.some(r=>r.id===activeThread))activeThread=list[0].id;const r=list.find(r=>r.id===activeThread);
 return '<div class="chat-layout"><aside class="panel chat-menu" aria-label="Conversations">'+list.map(q=>'<button class="thread '+(q.id===r.id?'active':'')+'" data-thread="'+h(q.id)+'"><strong>'+h(q.other.name)+'</strong><small>'+h(q.title)+'</small></button>').join('')+'</aside><section class="panel chat-main"><h2 class="chat-title">'+h(r.other.name)+'</h2><div class="bubbles" id="bubbles" role="log" aria-label="Message history"></div><form class="chat-composer" id="composer"><input name="message" aria-label="Message" placeholder="Write a message…" maxlength="1000" required autocomplete="off"><button class="button">Send ↑</button></form></section></div>';
}
async function showMessages(){const id=activeThread, node=el('#bubbles');if(!id||!node||refreshing)return;refreshing=true;try{const {messages}=await call('messages/'+id);if(el('#bubbles')!==node||activeThread!==id)return;const html=messages.map(m=>'<div class="bubble '+(m.author===data.me.id?'mine':'')+'">'+h(m.text)+'</div>').join('')||'<p class="muted">You’re connected. Say hello to get started.</p>';if(node.innerHTML!==html){const atBottom=node.scrollHeight-node.clientHeight-node.scrollTop<60;node.innerHTML=html;if(atBottom)node.scrollTop=node.scrollHeight;}}catch(e){if(el('#bubbles')===node)node.textContent=e.message;}finally{refreshing=false;}}
function render(){setNav();if(view==='discover'){el('main').innerHTML=discover();cards();el('#search').oninput=e=>{query=e.target.value;cards();};}
 else if(view==='requests')el('main').innerHTML=page('02 / Pair up','Requests','Choose who you want to connect with. Chat stays locked until a request is accepted.')+requests();
 else{el('main').innerHTML=page('03 / Talk it through','Messages','Private conversations between matched students.')+chat();showMessages();}}
async function refresh(){data=await call('state');render();}
function toast(msg){clearTimeout(timer);el('#toast').textContent=msg;timer=setTimeout(()=>el('#toast').textContent='',4300);}
function dialog(title,desc,fields,button,fn){const d=el('#modal');if(d.open)d.close();d.innerHTML='<div class="rowbetween"><h2>'+h(title)+'</h2><button class="button ghost" id="close-modal" aria-label="Close dialog">×</button></div><p class="muted">'+h(desc)+'</p><form>'+fields+'<div class="error" role="alert"></div><button class="button">'+h(button)+'</button></form>';el('#close-modal').onclick=()=>d.close();d.querySelector('form').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget;if(posting)return;posting=true;const b=form.querySelector('button');b.disabled=true;try{await fn(Object.fromEntries(new FormData(form)));d.close();await refresh();}catch(x){form.querySelector('.error').textContent=x.message;}finally{posting=false;b.disabled=false;}};d.showModal();}
const field=(title,name,type,max,auto)=>'<label>'+h(title)+'<input name="'+name+'" type="'+type+'" maxlength="'+max+'" '+(auto?'autocomplete="'+auto+'"':'')+' required></label>';
function account(register=false){if(demo)return dialog('Switch demo profile','Try both sides of a connection. Changes stay on this browser.','<label>Demo profile<select name="profile">'+people.map(p=>'<option value="'+h(p.id)+'" '+(p.id===data.me.id?'selected':'')+'>'+h(p.name)+'</option>').join('')+'</select></label>','Switch profile',async f=>{demoStore.active=f.profile;saveDemo();view='discover';activeThread='';query='';category='All';});
 if(data.me)return dialog('Your account','Signed in as '+data.me.name+'.','','Sign out',async()=>{await call('logout',{});view='discover';activeThread='';});
 const inputs=(register?field('Display name','name','text',60,'nickname')+field('Course or interest','detail','text',80)+field('Pilot invite code','invite','password',100):'')+field('Username','username','text',30,'username')+field('Password','password','password',128,register?'new-password':'current-password')+'<p><button type="button" class="button ghost" data-action="'+(register?'account':'register')+'">'+(register?'Back to sign in':'Create a pilot account')+'</button></p>';
 dialog(register?'Create a pilot account':'Sign in',register?'Use the invite code provided by the pilot organizer. Use a unique password of at least 10 characters.':'Sign in to post, send requests, and chat with your matches.',inputs,register?'Create account':'Sign in',async f=>{await call(register?'register':'login',f);toast('You’re signed in.');});
}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 try{
 if(d.view){view=d.view;await refresh();window.scrollTo({top:0});}
 else if(d.category){category=d.category;document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.category===category)));cards();}
 else if(d.thread){activeThread=d.thread;view='messages';render();}
 else if(d.respond){b.disabled=true;await call('requests/'+d.id+'/'+d.respond,{});await refresh();toast(d.respond==='accept'?'Request accepted. Chat unlocked.':'Request declined.');}
 else if(d.post){if(!data.me)return account();const p=data.posts.find(p=>p.id===d.post);dialog('Send a request','Start with a short intro to '+p.author.name+'. Chat opens once they accept.','<label>Your intro<textarea name="intro" maxlength="280" placeholder="Hey! I’m interested in…"></textarea></label>','Send request',async f=>{await call('requests',{post:p.id,intro:f.intro.trim()});toast('Request sent.');});}
 else if(d.action==='new'){if(!data.me)return account();dialog('Post what you need','Say who you’re looking for and what you want to do. Don’t share contact details in a post.','<label>Purpose<select name="category">'+categories.map(x=>'<option>'+x+'</option>').join('')+'</select></label>'+field('Title','title','text',85)+'<label>Details<textarea name="body" maxlength="360" required></textarea></label>','Publish post',async f=>{f.title=f.title.trim();f.body=f.body.trim();if(!f.title||!f.body)throw Error('Enter a title and details.');await call('posts',f);view='discover';category='All';query='';toast('Post published.');});}
 else if(d.action==='reset-filter'){category='All';query='';render();}
 else if(d.action==='account'||b.id==='account')account();
 else if(d.action==='register')account(true);
 }catch(x){b.disabled=false;toast(x.message);}
});
document.addEventListener('submit',async e=>{if(e.target.id!=='composer')return;e.preventDefault();const input=e.target.elements.message,b=e.target.querySelector('button'),msg=input.value.trim(),id=activeThread;if(!msg||b.disabled)return;b.disabled=true;try{await call('messages/'+id,{text:msg});input.value='';await showMessages();}catch(x){toast(x.message);}finally{b.disabled=false;input.focus();}});
(async()=>{demo=document.documentElement.dataset.mode==='demo'||location.protocol==='file:';if(!demo){try{data=await http('state');}catch(e){el('main').innerHTML=empty('The preview server could not be reached. Open the standalone demo file or restart the local server.');return;}}else{data=snapshot();}
 render();setInterval(()=>{if(view==='messages'&&!document.hidden)showMessages();},2500);
 if(!demo)setInterval(async()=>{if(document.hidden||el('#modal').open)return;try{const next=await call('state');if(JSON.stringify(next)!==JSON.stringify(data)){data=next;if(view==='requests')render();else if(view==='messages'&&!activeThread)render();else setNav();}}catch{}},5000);
})();
</script></body></html>
