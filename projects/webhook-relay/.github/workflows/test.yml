name: Test and demo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['17', '21']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile for Java 17
        run: javac -encoding UTF-8 --release 17 -d out src/Relay.java src/LoopbackWebhooks.java src/Demo.java tests/RelayTests.java
      - name: Run tests
        run: java -cp out RelayTests
      - name: Run local HTTP demo
        run: java -cp out Demo
